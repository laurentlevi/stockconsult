# Base H2 stockee dans un fichier local ./data/vulnstock.mv.db
# Le fichier est cree automatiquement au premier lancement.
spring.datasource.url=jdbc:h2:file:./data/vulnstock;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Rejoue schema.sql puis data.sql a chaque demarrage (base remise a plat -> pratique pour une demo)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Console H2 accessible sur /h2-console (utile comme cible interne pour la demo SSRF)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

server.port=8080
spring.thymeleaf.cache=false
